<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="真三风云 - 三国策略战棋游戏" />
    <title>真三风云 | San Storm</title>
  </head>
  <body>
    <div id="root">
      <div id="app-fallback" style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;background:#f9fafb;padding:20px;">
        <div style="text-align:center;max-width:400px;">
          <div style="font-size:48px;margin-bottom:16px;">⚔️</div>
          <h1 style="font-size:20px;color:#111;margin-bottom:8px;">真三風雲 San Storm</h1>
          <p style="color:#666;font-size:14px;margin-bottom:16px;">正在加载...</p>
          <p style="color:#999;font-size:12px;">如果长时间停留在此页面，请尝试：</p>
          <ul style="color:#999;font-size:12px;text-align:left;display:inline-block;margin-top:8px;">
            <li>使用 Chrome / Safari / Edge 最新版浏览器</li>
            <li>避免使用微信/QQ内置浏览器，请点击右上角「在浏览器中打开」</li>
            <li>清除浏览器缓存后刷新页面</li>
          </ul>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function() {
        var fb = document.getElementById('app-fallback');
        if (fb) { var p = fb.querySelector('p'); if (p) { p.textContent = '加载失败，请使用最新版 Chrome / Safari / Edge 浏览器访问'; p.style.color = '#dc2626'; } }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
