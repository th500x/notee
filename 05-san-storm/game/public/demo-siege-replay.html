<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>攻城战报 · 简化回放 Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #1a1a2e; color: #e0d5c0;
      font-family: "Segoe UI", "PingFang SC", sans-serif;
      padding: 16px;
    }
    h1 { text-align: center; font-size: 18px; letter-spacing: 4px; color: #c9a84c; text-shadow: 0 0 12px #c9a84c44; margin: 0 0 8px; }
    .sub { text-align: center; font-size: 12px; color: #666; margin-bottom: 16px; }
    #replay-root.hidden { display: none !important; }
    #reopen-bar { display: none; text-align: center; padding: 40px 16px; }
    #reopen-bar.visible { display: block; }
    .stage {
      max-width: 520px; margin: 0 auto; background: #12121e; border: 1px solid #333; border-radius: 10px;
      padding: 16px; min-height: 280px; position: relative; overflow: hidden;
    }
    .row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 20px; }
    .row-label { font-size: 11px; color: #888; width: 100%; text-align: center; margin-bottom: 6px; }
    .card {
      flex: 1; min-height: 100px; border-radius: 8px; padding: 10px; position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .card.attacker { background: linear-gradient(180deg, #1a2a4a 0%, #121a2e 100%); border: 1px solid #3b82f688; }
    .card.defender { background: linear-gradient(180deg, #4a1a1a 0%, #2e1212 100%); border: 1px solid #ef444488; }
    .card.active-att { box-shadow: 0 0 20px #3b82f6aa; }
    .card.active-def-hit { box-shadow: 0 0 24px #ef4444cc; animation: shake 0.35s ease; }
    .card .emoji { font-size: 36px; line-height: 1; margin-bottom: 4px; }
    .card img.portrait {
      width: 56px; height: 56px; object-fit: contain; margin-bottom: 6px;
      image-rendering: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .card .name { font-size: 12px; font-weight: bold; color: #c9a84c; text-align: center; }
    .card .hp { font-size: 10px; color: #888; margin-top: 4px; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    @keyframes atk-lunge {
      0% { transform: translateX(0) scale(1); }
      40% { transform: translateX(12px) scale(1.05); }
      100% { transform: translateX(0) scale(1); }
    }
    .card.lunge { animation: atk-lunge 0.45s ease-out; }
    .dmg-float {
      position: absolute; right: 8px; top: 8px; font-size: 18px; font-weight: bold;
      pointer-events: none; animation: dmg-up 0.9s ease-out forwards;
      text-shadow: 0 0 4px #000;
    }
    .dmg-float.crit { color: #fbbf24; font-size: 22px; }
    .dmg-float.norm { color: #fca5a5; }
    @keyframes dmg-up {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-36px); }
    }
    .log {
      font-size: 11px; color: #9ca3af; line-height: 1.5; max-height: 120px; overflow-y: auto;
      border-top: 1px solid #333; padding-top: 10px; margin-top: 8px;
    }
    .log .line { margin: 2px 0; opacity: 0.45; }
    .log .line.on { opacity: 1; color: #d6d3d1; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
      margin-top: 12px; padding-top: 12px; border-top: 1px solid #2a2a3a;
    }
    button {
      padding: 8px 20px; border: 1px solid #c9a84c88; background: #2a2a1e; color: #c9a84c;
      border-radius: 6px; cursor: pointer; font-size: 13px; min-width: 100px;
    }
    button:hover { background: #3a3a2e; border-color: #c9a84c; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.btn-close { border-color: #6b728088; color: #9ca3af; }
    button.btn-close:hover { border-color: #9ca3af; color: #e5e7eb; }
    .hint { font-size: 11px; color: #555; text-align: center; margin-top: 12px; max-width: 520px; margin-left: auto; margin-right: auto; line-height: 1.6; }
  </style>
</head>
<body>
  <h1>攻城战报 · 简化回放</h1>
  <p class="sub">按战报顺序依次：出击 → 受击抖动 → 飘字（不还原格子走位，仅演示节奏）</p>

  <div id="replay-root">
    <div class="stage" id="stage">
      <div class="row-label">对阵</div>
      <div class="row">
        <div class="card attacker" id="cardAtk">
          <div class="emoji" id="emojiAtk">⚔️</div>
          <div class="name" id="nameAtk">张飞·大戟士</div>
          <div class="hp" id="hpAtk">兵力 —</div>
        </div>
        <div class="card defender" id="cardDef">
          <div class="emoji" id="emojiDef">🛡️</div>
          <div class="name" id="nameDef">关羽·刀牌手</div>
          <div class="hp" id="hpDef">兵力 —</div>
        </div>
      </div>
      <div class="log" id="log"></div>
      <div class="controls">
        <button type="button" id="btnReplay">重播</button>
        <button type="button" id="btnClose" class="btn-close">关闭</button>
      </div>
    </div>

    <p class="hint">
      正式服：战报详情内嵌 <strong>SiegeReplayMini</strong>（<code style="color:#888">game/src/components/game/SiegeReplayMini.jsx</code>），本页为独立预览。<br />
      头像可换为上阵部队图；战报原文逐条高亮。URL：<code style="color:#888">?atkImg=…&amp;defImg=…</code>。路径：<code style="color:#888">/demo-siege-replay.html</code>
    </p>
  </div>

  <div id="reopen-bar">
    <p style="color:#888;font-size:14px;margin-bottom:16px;">演示已关闭</p>
    <button type="button" id="btnReopen">打开演示</button>
  </div>

  <script>
    const DEMO_STEPS = [
      { side: 'atk', damage: 124, crit: false, text: '第1回合：张飞·大戟士 对 关羽·刀牌手 造成 124 损失（命中）。' },
      { side: 'atk', damage: 201, crit: true, text: '第2回合：张飞·大戟士 对 关羽·刀牌手 造成 201 损失（暴击）。' },
      { side: 'def', damage: 98, crit: false, text: '第3回合：关羽·刀牌手 对 张飞·大戟士 造成 98 损失（命中）。' },
      { side: 'atk', damage: 156, crit: false, text: '第4回合：张飞·大戟士 对 关羽·刀牌手 造成 156 损失（命中）。' },
    ];

    const STEP_MS = 750;
    let playing = false;
    let atkHp = 3200;
    let defHp = 2800;

    const el = (id) => document.getElementById(id);

    (function applyPortraitUrls() {
      const q = new URLSearchParams(location.search);
      const atk = q.get('atkImg');
      const def = q.get('defImg');
      const mkImg = (url) => {
        const img = document.createElement('img');
        img.className = 'portrait';
        img.alt = '';
        img.src = url;
        img.onerror = function () { this.style.display = 'none'; };
        return img;
      };
      if (atk) {
        el('emojiAtk').replaceWith(mkImg(atk));
      }
      if (def) {
        el('emojiDef').replaceWith(mkImg(def));
      }
    })();

    function renderLog(highlightIndex) {
      const log = el('log');
      log.innerHTML = DEMO_STEPS.map((s, i) =>
        '<div class="line' + (i === highlightIndex ? ' on' : '') + '">' + s.text + '</div>'
      ).join('');
      if (highlightIndex >= 0) log.children[highlightIndex]?.scrollIntoView({ block: 'nearest' });
    }

    function playStep(step, idx) {
      el('nameAtk').textContent = '张飞·大戟士';
      el('nameDef').textContent = '关羽·刀牌手';

      const cardAtk = el('cardAtk');
      const cardDef = el('cardDef');
      cardAtk.classList.remove('active-att', 'lunge', 'active-def-hit');
      cardDef.classList.remove('active-att', 'lunge', 'active-def-hit');

      const dmgEl = document.createElement('div');
      dmgEl.className = 'dmg-float ' + (step.crit ? 'crit' : 'norm');
      dmgEl.textContent = (step.crit ? '暴击 ' : '') + '-' + step.damage;

      const swingLeft = step.side === 'atk';
      if (swingLeft) {
        cardAtk.classList.add('active-att', 'lunge');
        cardDef.appendChild(dmgEl);
        cardDef.classList.add('active-def-hit');
        defHp = Math.max(0, defHp - step.damage);
      } else {
        cardDef.classList.add('active-att', 'lunge');
        cardAtk.appendChild(dmgEl);
        cardAtk.classList.add('active-def-hit');
        atkHp = Math.max(0, atkHp - step.damage);
      }

      el('hpAtk').textContent = '约 ' + atkHp + '（演示用）';
      el('hpDef').textContent = '约 ' + defHp + '（演示用）';

      renderLog(idx);
      setTimeout(() => { dmgEl.remove(); }, 900);
    }

    async function playAll() {
      if (playing) return;
      playing = true;
      el('btnReplay').disabled = true;
      atkHp = 3200;
      defHp = 2800;
      el('hpAtk').textContent = '约 ' + atkHp;
      el('hpDef').textContent = '约 ' + defHp;
      renderLog(-1);

      for (let i = 0; i < DEMO_STEPS.length; i++) {
        playStep(DEMO_STEPS[i], i);
        await new Promise((r) => setTimeout(r, STEP_MS));
      }
      playing = false;
      el('btnReplay').disabled = false;
    }

    el('btnReplay').addEventListener('click', playAll);
    el('btnClose').addEventListener('click', () => {
      el('replay-root').classList.add('hidden');
      el('reopen-bar').classList.add('visible');
    });
    el('btnReopen').addEventListener('click', () => {
      el('replay-root').classList.remove('hidden');
      el('reopen-bar').classList.remove('visible');
      setTimeout(() => playAll(), 0);
    });

    renderLog(-1);
    el('hpAtk').textContent = '约 ' + atkHp;
    el('hpDef').textContent = '约 ' + defHp;
    // 进入页面或从「打开演示」返回后自动播一遍（与「简化回放」入口一致）
    setTimeout(() => playAll(), 0);
  </script>
</body>
</html>
