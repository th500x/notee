# GitHub 美国 IP 访问币安 fapi 会 HTTP 451；改拉 Bitget/Gate/Bybit 永续 ETHUSDT 15m，再 POST 到 11 ingest。
# 国内机访问不了交易所，所以由本工作流投递。
# 需在 GitHub repo Settings → Secrets 配置：
#   ETH_MA_INGEST_URL=https://notee.vip/api/life-resume/eth-ma-cross/ingest
#   ETH_MA_INGEST_SECRET=与生产 backend/.env 中同一串

name: eth-ma-klines

on:
  schedule:
    # 每根 15m 收盘后约 2 分钟；再加一组备份，减轻 GitHub cron 延迟
    - cron: '2,17,32,47 * * * *'
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:

jobs:
  push-klines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch perp klines and ingest
        working-directory: 11-life-resume/backend
        env:
          ETH_MA_INGEST_URL: ${{ secrets.ETH_MA_INGEST_URL }}
          ETH_MA_INGEST_SECRET: ${{ secrets.ETH_MA_INGEST_SECRET }}
        run: node scripts/push-eth-ma-klines.js
