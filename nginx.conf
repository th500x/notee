server {
    listen 80;
    server_name notee.vip 47.113.185.170;
    
    # Main page redirect to news calendar
    location = / {
        return 301 /news-calendar/;
    }
    
    # News calendar page
    location /news-calendar/ {
        alias /www/wwwroot/notee/news-calendar/dist/;
        try_files $uri $uri/ /news-calendar/index.html;
    }
    
    # News calendar API
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Future pages routing
    # location /page2/ {
    #     alias /www/wwwroot/notee/page2/dist/;
    #     try_files $uri $uri/ /page2/index.html;
    # }
    
    # location /page2/api/ {
    #     proxy_pass http://127.0.0.1:3002/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    
    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}