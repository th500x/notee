<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-item {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>租赁追踪系统 API 测试</h1>
    
    <div class="test-item">
        <h3>环境信息</h3>
        <p>当前环境: <strong id="env"></strong></p>
        <p>API 基础 URL: <strong id="baseUrl"></strong></p>
    </div>

    <div class="test-item">
        <h3>测试 1: 健康检查</h3>
        <button onclick="testHealth()">测试 /health</button>
        <div id="healthResult"></div>
    </div>

    <div class="test-item">
        <h3>测试 2: 获取项目列表</h3>
        <button onclick="testProjects()">测试 /projects</button>
        <div id="projectsResult"></div>
    </div>

    <div class="test-item">
        <h3>测试 3: 直接访问后端</h3>
        <button onclick="testDirect()">测试 http://localhost:3003/health</button>
        <div id="directResult"></div>
    </div>

    <script>
        // 检测环境
        const isProd = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';
        const API_BASE_URL = isProd ? '/rental-api' : 'http://localhost:3003';
        
        document.getElementById('env').textContent = isProd ? '生产环境' : '开发环境';
        document.getElementById('baseUrl').textContent = API_BASE_URL;

        async function testHealth() {
            const resultDiv = document.getElementById('healthResult');
            resultDiv.innerHTML = '<p>测试中...</p>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/health`);
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <p>✅ 成功！状态码: ${response.status}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <p>❌ 失败！状态码: ${response.status}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <p>❌ 请求失败！</p>
                        <pre>${error.message}</pre>
                    </div>
                `;
            }
        }

        async function testProjects() {
            const resultDiv = document.getElementById('projectsResult');
            resultDiv.innerHTML = '<p>测试中...</p>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/projects`);
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <p>✅ 成功！状态码: ${response.status}</p>
                            <p>项目数量: ${data.projects ? data.projects.length : 0}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <p>❌ 失败！状态码: ${response.status}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <p>❌ 请求失败！</p>
                        <pre>${error.message}</pre>
                    </div>
                `;
            }
        }

        async function testDirect() {
            const resultDiv = document.getElementById('directResult');
            resultDiv.innerHTML = '<p>测试中...</p>';
            
            try {
                const response = await fetch('http://localhost:3003/health');
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <p>✅ 成功！后端服务正常运行</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <p>❌ 失败！状态码: ${response.status}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <p>❌ 无法连接到后端服务！</p>
                        <p>可能原因：</p>
                        <ul>
                            <li>后端服务未启动</li>
                            <li>端口 3003 未开放</li>
                            <li>CORS 限制</li>
                        </ul>
                        <pre>${error.message}</pre>
                    </div>
                `;
            }
        }

        // 页面加载时自动测试
        window.onload = function() {
            testHealth();
        };
    </script>
</body>
</html>
