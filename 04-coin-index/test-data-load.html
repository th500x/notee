<!DOCTYPE html>
<html>
<head>
    <title>数据加载测试</title>
</head>
<body>
    <h1>数据加载测试</h1>
    <div id="result"></div>
    
    <script>
        async function testDataLoad() {
            const resultDiv = document.getElementById('result');
            
            // 测试多个路径
            const paths = [
                '/coin-index/weeklyData.json',
                '/weeklyData.json',
                './weeklyData.json'
            ];
            
            for (const path of paths) {
                try {
                    console.log(`测试路径: ${path}`);
                    const response = await fetch(path);
                    
                    if (response.ok) {
                        const data = await response.json();
                        resultDiv.innerHTML = `
                            <h2>✅ 成功加载数据</h2>
                            <p><strong>路径:</strong> ${path}</p>
                            <p><strong>周数:</strong> ${Object.keys(data).length}</p>
                            <p><strong>2026-W01数据:</strong></p>
                            <pre>${JSON.stringify(data['2026-W01'], null, 2)}</pre>
                        `;
                        return;
                    } else {
                        console.log(`路径 ${path} 返回状态: ${response.status}`);
                    }
                } catch (error) {
                    console.log(`路径 ${path} 错误:`, error);
                }
            }
            
            resultDiv.innerHTML = '<h2>❌ 所有路径都失败</h2>';
        }
        
        testDataLoad();
    </script>
</body>
</html>
