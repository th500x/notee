server {
    listen 80;
    server_name notee.vip 47.113.185.170;
    
    # Main page - Notee homepage
    location = / {
        root /www/wwwroot/notee;
        try_files /index.html =404;
    }
    
    # ==========================================
    # 新的项目路径配置 (推荐使用)
    # ==========================================
    
    # 01-news-calendar (新聞筆記) - 新路径
    location /01-news-calendar/ {
        alias /www/wwwroot/notee/01-news-calendar/dist/;
        try_files $uri $uri/ /01-news-calendar/index.html;
        
        # 添加安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
    
    # 04-coin-index (區塊指標) - 新路径
    location /04-coin-index/ {
        alias /www/wwwroot/notee/04-coin-index/dist/;
        try_files $uri $uri/ /04-coin-index/index.html;
        
        # 添加安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
    
    # ==========================================
    # 兼容性配置 (临时保留，后续可删除)
    # ==========================================
    
    # 旧的news-calendar路径 - 重定向到新路径
    location /news-calendar/ {
        return 301 /01-news-calendar/;
    }
    
    # 或者如果你想保持旧路径可用，使用这个配置：
    # location /news-calendar/ {
    #     alias /www/wwwroot/notee/01-news-calendar/dist/;
    #     try_files $uri $uri/ /news-calendar/index.html;
    # }
    
    # ==========================================
    # API 配置
    # ==========================================
    
    # News calendar API (保持不变)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # 启用缓冲
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # ==========================================
    # 未来页面预留配置
    # ==========================================
    
    # 02-page2 预留
    # location /02-page2/ {
    #     alias /www/wwwroot/notee/02-page2/dist/;
    #     try_files $uri $uri/ /02-page2/index.html;
    # }
    
    # 03-page3 预留
    # location /03-page3/ {
    #     alias /www/wwwroot/notee/03-page3/dist/;
    #     try_files $uri $uri/ /03-page3/index.html;
    # }
    
    # ==========================================
    # 静态资源优化
    # ==========================================
    
    # 静态资源缓存 - JS/CSS/图片
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        
        # 启用gzip压缩
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/xml+rss
            application/json;
    }
    
    # HTML文件缓存策略
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
    
    # JSON数据文件
    location ~* \.json$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        add_header Content-Type "application/json; charset=utf-8";
    }
    
    # ==========================================
    # 安全配置
    # ==========================================
    
    # 隐藏nginx版本
    server_tokens off;
    
    # 防止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 防止访问备份文件
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ==========================================
    # 错误页面
    # ==========================================
    
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        root /www/wwwroot/notee;
        internal;
    }
    
    location = /50x.html {
        root /www/wwwroot/notee;
        internal;
    }
    
    # ==========================================
    # 日志配置
    # ==========================================
    
    access_log /www/wwwlogs/notee_access.log;
    error_log /www/wwwlogs/notee_error.log;
}

