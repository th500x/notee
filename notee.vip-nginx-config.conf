# HTTP服务器 - 重定向到HTTPS
server {
    listen 80;
    server_name notee.vip www.notee.vip 47.113.185.170;
    
    # 重定向所有HTTP请求到HTTPS
    return 301 https://notee.vip$request_uri;
}

# HTTPS服务器
server {
    listen 443 ssl http2;
    server_name notee.vip www.notee.vip 47.113.185.170;
    
    root /www/wwwroot/notee;
    index index.html;
    
    # SSL证书配置
    ssl_certificate /www/server/panel/vhost/cert/notee.vip/notee.vip_cert_chain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/notee.vip/notee.vip_key.key;
    
    # SSL配置优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # 安全头部
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # 主页
    location = / {
        try_files /index.html =404;
    }
    
    # 01-news-calendar
    location /01-news-calendar {
        alias /www/wwwroot/notee/01-news-calendar/dist;
        try_files $uri $uri/ /01-news-calendar/index.html;
    }
    
    # 02-tale-historical
    location /02-tale-historical {
        alias /www/wwwroot/notee/02-tale-historical/dist;
        try_files $uri $uri/ /02-tale-historical/index.html;
    }
    
    # 05-san-storm
    location /05-san-storm {
        alias /www/wwwroot/notee/05-san-storm/dist;
        try_files $uri $uri/ /05-san-storm/index.html;
    }
    
    # 06-rental-tracking
    location /06-rental-tracking {
        alias /www/wwwroot/notee/06-rental-tracking/dist;
        try_files $uri $uri/ /06-rental-tracking/index.html;
    }
    
    # 新闻日历API代理
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 租赁追踪API代理
    location /rental-api/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 留言板API代理
    location /guestbook-api/ {
        proxy_pass http://127.0.0.1:3003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
