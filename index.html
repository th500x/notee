<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍺</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notee - 多功能网页应用</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .news-gradient {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .page2-gradient {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .page3-gradient {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
        
        .page4-gradient {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">無限筆記</h1>
                    <p class="text-gray-600 mt-2">多功能网页应用平台</p>
                </div>
                <div class="flex items-center space-x-4">
                    <div 
                        class="text-sm text-gray-500 hover:text-blue-600 cursor-pointer transition-colors relative group"
                        onclick="shareWebsite()"
                    >
                        🍺 LOVE & PEACE!
                        <!-- 悬停提示 -->
                        <div class="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 px-2 py-1 bg-gray-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">
                            分享本站
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-16">
        <!-- Feature Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl mx-auto">
            <!-- 新聞筆記 Card -->
            <div class="card-hover bg-white rounded-xl shadow-lg overflow-hidden cursor-pointer" onclick="navigateToNews()">
                <div class="news-gradient h-32 flex items-center justify-center">
                    <div class="text-white text-center">
                        <div class="text-4xl mb-2">📰</div>
                        <h3 class="text-2xl font-bold">新聞筆記</h3>
                    </div>
                </div>
                <div class="p-6">
                    <p class="text-gray-600 text-center">
                        浏览每日重要新闻，了解世界动态<br>
                        支持日历视图和热门新闻排行
                    </p>
                </div>
            </div>

            <!-- Page 2 Card -->
            <div class="card-hover bg-white rounded-xl shadow-lg overflow-hidden cursor-pointer" onclick="navigateToCoinIndex()">
                <div class="page2-gradient h-32 flex items-center justify-center">
                    <div class="text-white text-center">
                        <div class="text-4xl mb-2">📊</div>
                        <h3 class="text-2xl font-bold">區塊指標</h3>
                    </div>
                </div>
                <div class="p-6">
                    <p class="text-gray-600 text-center">
                        区块链市场数据分析<br>
                        周度指标追踪和趋势分析
                    </p>
                </div>
            </div>

            <!-- Page 3 Card -->
            <div class="card-hover bg-white rounded-xl shadow-lg overflow-hidden cursor-pointer opacity-50" onclick="showComingSoon('功能三')">
                <div class="page3-gradient h-32 flex items-center justify-center">
                    <div class="text-white text-center">
                        <div class="text-4xl mb-2">⚡</div>
                        <h3 class="text-2xl font-bold">功能三</h3>
                    </div>
                </div>
                <div class="p-6">
                    <p class="text-gray-600 text-center">
                        敬请期待...<br>
                        更多精彩功能即将上线
                    </p>
                </div>
            </div>

            <!-- Page 4 Card -->
            <div class="card-hover bg-white rounded-xl shadow-lg overflow-hidden cursor-pointer opacity-50" onclick="showComingSoon('功能四')">
                <div class="page4-gradient h-32 flex items-center justify-center">
                    <div class="text-white text-center">
                        <div class="text-4xl mb-2">🎯</div>
                        <h3 class="text-2xl font-bold">功能四</h3>
                    </div>
                </div>
                <div class="p-6">
                    <p class="text-gray-600 text-center">
                        敬请期待...<br>
                        更多精彩功能即将上线
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t mt-16">
        <div class="max-w-7xl mx-auto px-4 py-8">
            <div class="text-center text-gray-500">
                <p>&copy; 2026 Notee. Built with passion for creating useful web applications.</p>
                <p class="mt-2">🍺 LOVE & PEACE!</p>
            </div>
        </div>
    </footer>

    <script>
        function navigateToNews() {
            window.location.href = '/01-news-calendar/';
        }
        
        function navigateToCoinIndex() {
            window.location.href = '/04-coin-index/';
        }
        
        function showComingSoon(featureName) {
            alert(`${featureName}功能即将上线，敬请期待！`);
        }
        
        function shareWebsite() {
            const url = window.location.origin;
            
            // 尝试使用现代的 Clipboard API
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(url).then(() => {
                    showNotification('网站链接已复制到剪贴板！', 'success');
                }).catch(() => {
                    fallbackCopyText(url);
                });
            } else {
                // 降级方案
                fallbackCopyText(url);
            }
        }
        
        function fallbackCopyText(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                showNotification('网站链接已复制到剪贴板！', 'success');
            } catch (err) {
                showNotification('复制失败，请手动复制：' + text, 'error');
            }
            
            document.body.removeChild(textArea);
        }
        
        function showNotification(message, type) {
            // 创建通知元素
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 px-6 py-3 rounded-lg shadow-lg z-50 transition-all duration-300 transform translate-x-full ${
                type === 'success' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'
            }`;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            // 显示动画
            setTimeout(() => {
                notification.classList.remove('translate-x-full');
            }, 100);
            
            // 3秒后自动消失
            setTimeout(() => {
                notification.classList.add('translate-x-full');
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 3000);
        }
    </script>
</body>
</html>
